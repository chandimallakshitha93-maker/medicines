const KK="ganthuna-ds-key",KC="ganthuna-ds-cred";
let pending=null;
const $=id=>document.getElementById(id);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), bu=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const bioOK=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&location.protocol==="https:");
async function deriveRaw(pin){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);for(const w of LOCK.w){try{const kb=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(w.s),iterations:LOCK.it},km,256);const kek=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);return await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.iv)},kek,ub(w.w))}catch(e){}}throw new Error("bad")}
const KP="ganthuna-ds-pending";
async function decryptWith(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(LOCK.iv)},k,ub(LOCK.ct)))}
const ORIG=location.href.split('#')[0];
const NAV=()=>`<div id="dsnav" style="position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;background:#0B5C52;padding:5px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-family:Inter,'Noto Sans Sinhala',sans-serif"><button onclick="(history.length>1?history.back():location.href='${ORIG}')" style="border:0;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;background:#fff;color:#0B5C52;cursor:pointer">← සොයන්න · Find</button><button onclick="try{sessionStorage.removeItem('${KK}')}catch(e){};if(confirm('Also forget this device (remember / Face ID)?')){try{localStorage.removeItem('${KK}');localStorage.removeItem('${KC}')}catch(e){}};(history.length>1?history.back():location.href='${ORIG}')" style="border:0;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;background:rgba(255,255,255,.18);color:#fff;cursor:pointer">🔒 Lock</button></div>`;
const AFTER=id=>`<script>(function(){const id=${JSON.stringify(id||'')};if(id)setTimeout(()=>{try{select(id,true)}catch(e){}},400);document.body.style.paddingBottom="56px"})();<\/script>`;
function resetUI(){$("go").disabled=false;$("go").textContent="විවෘත කරන්න · Unlock";$("pin").value="";$("err").textContent=""}
function enter(html,raw){ss.set(KK,bu(raw));const id=pending;pending=null;resetUI();
html=html.replace("<body>","<body>"+NAV()).replace("</body>",AFTER(id)+"</body>");location.href=URL.createObjectURL(new Blob([html],{type:"text/html"}))}
async function tryPin(){const p=$("pin").value.trim();$("err").textContent="";if(!/^\d{4,6}$/.test(p)){$("err").textContent="Enter your 4–6 digit PIN";return}
$("go").disabled=true;$("go").textContent="…";
let credP=null;if($("rem").checked&&bioOK&&!ls.get(KC)){credP=Promise.race([navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"DH Ganthuna Drug Store"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"drugstore",displayName:"Drug store user"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:30000}}).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),35000))])}
let raw,html;try{raw=await deriveRaw(p);html=await decryptWith(raw)}catch(e){$("err").textContent="වැරදි PIN · Wrong PIN";$("go").disabled=false;$("go").textContent="විවෘත කරන්න · Unlock";$("pin").value="";return}
if($("rem").checked){ls.set(KK,bu(raw));if(credP){$("go").textContent="Face ID…";const c=await credP;if(c&&c.rawId)ls.set(KC,bu(c.rawId))}}
enter(html,raw)}
async function tryBio(){$("err").textContent="";const raw=ls.get(KK),cid=ls.get(KC);if(!raw||!cid)return;try{const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:ub(cid)}],userVerification:"required",timeout:60000}});if(a){const r=ub(raw);enter(await decryptWith(r),r)}}catch(e){$("err").textContent="Face ID / fingerprint not accepted – use the PIN"}}
function lockScreen(){const has=ls.get(KK);$("bio").classList.toggle("hide",!(bioOK&&has&&ls.get(KC)));$("lock").classList.remove("hide");setTimeout(()=>$("pin").focus(),50)}
async function show(n){$("f1").classList.toggle("hide",n!==1);$("b1").classList.toggle("on",n===1);$("b2").classList.toggle("on",n===2);
if(n!==2){$("lock").classList.add("hide");return}
const s=ss.get(KK)||(!ls.get(KC)?ls.get(KK):null);if(s){try{const r=ub(s);enter(await decryptWith(r),r);return}catch(e){ss.del(KK)}}
lockScreen()}
$("go").onclick=tryPin;$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")tryPin()});$("bio").onclick=tryBio;
if(!bioOK)$("remL").lastChild.textContent=" මෙම උපාංගයේ මතක තබන්න · Remember on this device";else $("remL").lastChild.textContent=" මතක තබන්න + Face ID / ඇඟිලි සලකුණ · Remember & use Face ID / fingerprint";
window.addEventListener("message",e=>{const d=e.data;if(d&&d.ds){pending=d.ds;show(2)}});
window.addEventListener("pageshow",e=>{resetUI();pending=null;show(1)});
if(location.hash==="#drugstore")show(2);
</script></body></html>

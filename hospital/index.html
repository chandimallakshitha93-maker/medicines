const KK="ganthuna-ds-key",KC="ganthuna-ds-cred";
let unlocked=false,pending=null;
const $=id=>document.getElementById(id);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), bu=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const bioOK=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&location.protocol==="https:");
async function deriveRaw(pin){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);for(const w of LOCK.w){try{const kb=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(w.s),iterations:LOCK.it},km,256);const kek=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);return await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.iv)},kek,ub(w.w))}catch(e){}}throw new Error("bad")}
async function openWith(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(LOCK.iv)},k,ub(LOCK.ct));
$("f2").srcdoc=new TextDecoder().decode(pt);unlocked=true;ss.set(KK,bu(raw));$("lock").classList.add("hide");$("f2").classList.remove("hide");$("lockNow").classList.remove("hide");$("b2").innerHTML='💊 ඖෂධ ගබඩාව 3D<small>Main Drug Store – 3D, locator &amp; expiry</small>';
if(pending){const id=pending;pending=null;$("f2").addEventListener("load",()=>setTimeout(()=>{try{$("f2").contentWindow.postMessage({ds:id},"*")}catch(x){}},150),{once:true})}}
async function tryPin(){const p=$("pin").value.trim();$("err").textContent="";if(!/^\d{4,6}$/.test(p)){$("err").textContent="Enter your 4–6 digit PIN";return}
$("go").disabled=true;$("go").textContent="…";try{const raw=await deriveRaw(p);await openWith(raw);
if($("rem").checked){ls.set(KK,bu(raw));if(bioOK&&!ls.get(KC)){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"DH Ganthuna Drug Store"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"drugstore",displayName:"Drug store user"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});if(c)ls.set(KC,bu(c.rawId))}catch(e){}}}
}catch(e){$("err").textContent="වැරදි PIN · Wrong PIN"}$("go").disabled=false;$("go").textContent="විවෘත කරන්න · Unlock";$("pin").value=""}
async function tryBio(){$("err").textContent="";const raw=ls.get(KK),cid=ls.get(KC);if(!raw||!cid)return;try{const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:ub(cid)}],userVerification:"required",timeout:60000}});if(a)await openWith(ub(raw))}catch(e){$("err").textContent="Face ID / fingerprint not accepted – use the PIN"}}
function lockScreen(){const has=ls.get(KK);$("bio").classList.toggle("hide",!(bioOK&&has&&ls.get(KC)));$("lock").classList.remove("hide");$("f2").classList.add("hide");setTimeout(()=>$("pin").focus(),50)}
async function show(n){$("f1").classList.toggle("hide",n!==1);$("b1").classList.toggle("on",n===1);$("b2").classList.toggle("on",n===2);
if(n!==2){$("lock").classList.add("hide");$("f2").classList.add("hide");return}
if(unlocked){$("f2").classList.remove("hide");return}
const s=ss.get(KK)||(!ls.get(KC)?ls.get(KK):null);if(s){try{await openWith(ub(s));return}catch(e){ss.del(KK)}}
lockScreen();if(bioOK&&ls.get(KK)&&ls.get(KC))tryBio()}
function relock(){unlocked=false;ss.del(KK);$("f2").srcdoc="";$("lockNow").classList.add("hide");$("b2").innerHTML='🔒 ඖෂධ ගබඩාව 3D<small>Main Drug Store – pharmacist &amp; DMO only</small>';
if(confirm("Also forget this device (remove 'remember' and Face ID)?")){ls.del(KK);ls.del(KC)}show(1)}
$("go").onclick=tryPin;$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")tryPin()});$("bio").onclick=tryBio;
if(!bioOK)$("remL").lastChild.textContent=" මෙම උපාංගයේ මතක තබන්න · Remember on this device";else $("remL").lastChild.textContent=" මතක තබන්න + Face ID / ඇඟිලි සලකුණ · Remember & use Face ID / fingerprint";
window.addEventListener("message",e=>{const d=e.data;if(d&&d.ds){if(unlocked){show(2);setTimeout(()=>{try{$("f2").contentWindow.postMessage({ds:d.ds},"*")}catch(x){}},120)}else{pending=d.ds;show(2)}}});
if(location.hash==="#drugstore")show(2);
